    <!-- Script do Submenu (Dropdown) de Créditos -->
    <script>
        (function () {
            var itemDropdown = document.querySelector('.menu-dropdown');
            var botaoSeta = document.querySelector('.seta-dropdown');

            if (!itemDropdown || !botaoSeta) return;

            function fecharDropdown() {
                itemDropdown.classList.remove('aberto');
                botaoSeta.setAttribute('aria-expanded', 'false');
            }

            botaoSeta.addEventListener('click', function (evento) {
                evento.preventDefault();
                evento.stopPropagation();
                var estaAberto = itemDropdown.classList.toggle('aberto');
                botaoSeta.setAttribute('aria-expanded', estaAberto ? 'true' : 'false');
            });

            document.addEventListener('click', function (evento) {
                if (!itemDropdown.contains(evento.target)) {
                    fecharDropdown();
                }
            });

            document.addEventListener('keydown', function (evento) {
                if (evento.key === 'Escape') {
                    fecharDropdown();
                }
            });
        })();
    </script>

    <!-- Botão Voltar ao Topo -->
    <button type="button" id="btn-topo" class="btn-topo" aria-label="Voltar ao topo">&#9650;</button>

    <script>
        (function () {
            var btnTopo = document.getElementById('btn-topo');
            var cabecalho = document.getElementById('topo');

            // Na home a seta fica sempre visível (a página é curta e quase não rola)
            btnTopo.classList.add('visivel');

            btnTopo.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (cabecalho && typeof cabecalho.focus === 'function') {
                    cabecalho.setAttribute('tabindex', '-1');
                    cabecalho.focus({ preventScroll: true });
                }
            });
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script do Menu Hambúrguer (celular) -->
    <script>
        (function () {
            var menu = document.getElementById('topo');
            var botao = menu ? menu.querySelector('.menu-toggle') : null;
            if (!menu || !botao) return;

            function fecharMenu() {
                menu.classList.remove('menu-aberto');
                botao.setAttribute('aria-expanded', 'false');
            }

            botao.addEventListener('click', function (evento) {
                evento.stopPropagation();
                var aberto = menu.classList.toggle('menu-aberto');
                botao.setAttribute('aria-expanded', aberto ? 'true' : 'false');
            });

            // Clicar fora do menu fecha
            document.addEventListener('click', function (evento) {
                if (!menu.contains(evento.target)) {
                    fecharMenu();
                }
            });

            // ESC fecha
            document.addEventListener('keydown', function (evento) {
                if (evento.key === 'Escape') {
                    fecharMenu();
                }
            });

            // Se a tela voltar a ser grande (ex.: girar o celular), fecha o menu
            window.addEventListener('resize', function () {
                if (window.innerWidth > 768) {
                    fecharMenu();
                }
            });
        })();
    </script>
